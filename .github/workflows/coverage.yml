name: Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  coverage:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests with coverage
        run: npm run test:coverage
      
      - name: Check coverage thresholds
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "Coverage summary not found"
            exit 1
          fi
          
          STATEMENTS=$(grep -o '"statements"[^}]*' coverage/coverage-summary.json | grep -o '[0-9.]*' | head -1)
          BRANCHES=$(grep -o '"branches"[^}]*' coverage/coverage-summary.json | grep -o '[0-9.]*' | head -1)
          FUNCTIONS=$(grep -o '"functions"[^}]*' coverage/coverage-summary.json | grep -o '[0-9.]*' | head -1)
          LINES=$(grep -o '"lines"[^}]*' coverage/coverage-summary.json | grep -o '[0-9.]*' | head -1)
          
          echo "Coverage Report:"
          echo "Statements: ${STATEMENTS}%"
          echo "Branches: ${BRANCHES}%"
          echo "Functions: ${FUNCTIONS}%"
          echo "Lines: ${LINES}%"
          
          if (( $(echo "$STATEMENTS < 100" | bc -l) )); then
            echo "ERROR: Statements coverage is below 100%"
            exit 1
          fi
          if (( $(echo "$BRANCHES < 100" | bc -l) )); then
            echo "ERROR: Branches coverage is below 100%"
            exit 1
          fi
          if (( $(echo "$FUNCTIONS < 100" | bc -l) )); then
            echo "ERROR: Functions coverage is below 100%"
            exit 1
          fi
          if (( $(echo "$LINES < 100" | bc -l) )); then
            echo "ERROR: Lines coverage is below 100%"
            exit 1
          fi
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
          verbose: true
      
      - name: Generate coverage badge
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p .github/badges
          COVERAGE=$(grep -o '"lines"[^}]*' coverage/coverage-summary.json | grep -o '[0-9.]*' | head -1)
          echo "Coverage: ${COVERAGE}%"
          
          # Create a simple badge URL (using shields.io)
          BADGE_URL="https://img.shields.io/badge/coverage-${COVERAGE}%25-brightgreen"
          echo "Badge URL: $BADGE_URL"
      
      - name: Comment PR with coverage report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json', 'utf8'));
            const total = coverage.total;
            
            const comment = `## Coverage Report
            
            | Metric | Coverage |
            |--------|----------|
            | Statements | ${total.statements.pct}% |
            | Branches | ${total.branches.pct}% |
            | Functions | ${total.functions.pct}% |
            | Lines | ${total.lines.pct}% |
            
            ✅ All coverage thresholds met (100% required)`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
